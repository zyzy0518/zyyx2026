            margin: 0;
            padding: 20px;

        .card {

            border-radius: 48px;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            padding: 2rem 1.8rem;

            max-width: 600px;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.6);
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 0.25rem;
            color: #1e2b3c;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .sub {
            color: #5a6e7c;
            border-left: 3px solid #7c9eb2;
            padding-left: 12px;
            margin: 12px 0 28px 0;
            font-size: 0.9rem;
        }
        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }
        input {
            flex: 3;
            padding: 16px 18px;
            font-size: 1rem;
            border: 1.5px solid #dce5ec;
            border-radius: 40px;
            outline: none;
            background: white;
            transition: 0.2s;
            font-weight: 500;
            color: #1f3a46;
        }
        input:focus {
            border-color: #4f9da6;
            box-shadow: 0 0 0 3px rgba(79,157,166,0.2);
        }
        button {
            flex: 1;
            background: #2c5f6e;
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            padding: 0 20px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        button:hover {
            background: #1e4552;
            transform: scale(0.97);
        }
        button:disabled {
            background: #9bb7c2;
            cursor: not-allowed;
            transform: none;
        }
        .result {
            background: #fef7e0;
            border-radius: 32px;
            padding: 20px 24px;
            margin-top: 10px;
            border-left: 8px solid #f5bc70;
            word-break: break-word;
            transition: 0.15s;
        }
        .result p {
            margin: 0;
            font-size: 1.2rem;
            line-height: 1.4;
        }
        .result .label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b36b1e;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .error {
            background: #ffe8e6;
            border-left-color: #e26d5c;
        }
        .error .label {
            color: #b13b2a;
        }
        .footer {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 28px;
            color: #8ca0ac;
        }
        .rate-info {
            font-size: 0.7rem;
            text-align: center;
            margin-top: 12px;
            background: #eef2f5;
            padding: 6px 12px;
            border-radius: 40px;
            display: inline-block;
            width: auto;
            color: #4a6272;
        }
        hr {
            margin: 20px 0 8px;
            border: none;
            border-top: 1px solid #e2e8f0;
        }
        @media (max-width: 500px) {
            .card { padding: 1.5rem; }
            h1 { font-size: 1.6rem; }
            .result p { font-size: 1rem; }
        }
    </style>
</head>

        },

            aliases: ["汪子力", "小汪"],
            text: "顺毛，卷毛，苹果掌控者，生化标签3D绘画掌控者，猫猫，锻炼，长发（伪）"
        },

            aliases: ["耿银泽","小耿"],
            text: "眼睛弯弯"
        },
        {
            aliases: ["周欣宇","小鱼干"],
            text: "萌萌，当初有段时间放学了边走边复盘当日，好久不见"
        },

            aliases: ["酵母菌"],
            text: "为什么会搜酵母菌"

    // ============================================================
    // ⚙️ 第二步：限流配置 ———— 整体间隔变长（每日限制）
    // ============================================================
    const RATE_LIMIT = {
        perNameSeconds: 86400,        // 每个名字 24 小时内只能查一次（一天）
        globalWindowMinutes: 1440,    // 全局窗口 1440 分钟 = 24 小时
        globalMaxQueries: 8           // 每台设备 24 小时内最多查询 8 次（防止枚举）
    };

    // ============================================================
    // 🧠 构建名字 -> 印象的映射
    // ============================================================
    const nameToImpression = new Map();
    for (const group of impressionGroups) {
        const text = group.text;
        for (const alias of group.aliases) {
            nameToImpression.set(alias, text);
        }
    }

    // ============================================================
    // 📦 限流存储（localStorage）
    // ============================================================
    const STORAGE_KEY_NAME_TIMES = "impression_name_last_query";
    const STORAGE_KEY_GLOBAL_LOG = "impression_global_log";

    function getNameLastTime(name) {
        const data = localStorage.getItem(STORAGE_KEY_NAME_TIMES);
        if (!data) return 0;
        const obj = JSON.parse(data);
        return obj[name] || 0;
    }

    function updateNameLastTime(name, timestamp) {
        const data = localStorage.getItem(STORAGE_KEY_NAME_TIMES);
        let obj = data ? JSON.parse(data) : {};
        obj[name] = timestamp;
        // 清理超过7天的旧记录
        const oneWeek = 7 * 24 * 3600 * 1000;
        const now = Date.now();
        for (let k in obj) {
            if (obj[k] < now - oneWeek) delete obj[k];
        }
        localStorage.setItem(STORAGE_KEY_NAME_TIMES, JSON.stringify(obj));
    }

    function getGlobalQueryLog() {
        const raw = localStorage.getItem(STORAGE_KEY_GLOBAL_LOG);
        if (!raw) return [];
        try {
            return JSON.parse(raw);
        } catch(e) { return []; }
    }

    function addGlobalQueryLog(timestamp) {
        let logs = getGlobalQueryLog();
        logs.push(timestamp);
        const windowMs = RATE_LIMIT.globalWindowMinutes * 60 * 1000;
        const cutoff = Date.now() - windowMs;
        logs = logs.filter(ts => ts > cutoff);
        localStorage.setItem(STORAGE_KEY_GLOBAL_LOG, JSON.stringify(logs));
    }

    function checkGlobalLimit() {
        const logs = getGlobalQueryLog();
        const windowMs = RATE_LIMIT.globalWindowMinutes * 60 * 1000;
        const cutoff = Date.now() - windowMs;
        const recentCount = logs.filter(ts => ts > cutoff).length;
        return recentCount < RATE_LIMIT.globalMaxQueries;
    }

    function getGlobalWaitSeconds() {
        const logs = getGlobalQueryLog();
        const windowMs = RATE_LIMIT.globalWindowMinutes * 60 * 1000;
        const now = Date.now();
        const cutoff = now - windowMs;
        const recent = logs.filter(ts => ts > cutoff).sort((a,b)=>a-b);
        if (recent.length < RATE_LIMIT.globalMaxQueries) return 0;
        const oldestInWindow = recent[0];
        const expireTime = oldestInWindow + windowMs;
        const waitMs = expireTime - now;
        return Math.ceil(waitMs / 1000);
    }

    function checkNameCooldown(name) {
        const lastTime = getNameLastTime(name);
        if (lastTime === 0) return { ok: true, waitSeconds: 0 };
        const cooldownMs = RATE_LIMIT.perNameSeconds * 1000;
        const nextAllowTime = lastTime + cooldownMs;
        const now = Date.now();
        if (now >= nextAllowTime) return { ok: true, waitSeconds: 0 };
        const waitSec = Math.ceil((nextAllowTime - now) / 1000);
        return { ok: false, waitSeconds: waitSec };
    }

    // 友好显示剩余等待时间（自动转换为秒/分钟/小时/天）
    function formatWaitTime(seconds) {
        if (seconds < 60) return `${seconds} 秒`;
        if (seconds < 3600) {
            const minutes = Math.floor(seconds / 60);
            return `${minutes} 分钟`;
        }
        if (seconds < 86400) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            return `${hours} 小时 ${minutes} 分钟`;
        }
        const days = Math.floor(seconds / 86400);
        const hours = Math.floor((seconds % 86400) / 3600);
        return `${days} 天 ${hours} 小时`;
    }

    function recordQuery(name) {
        const now = Date.now();
        updateNameLastTime(name, now);
        addGlobalQueryLog(now);
    }

    // ============================================================
    // 🔍 查询核心
    // ============================================================
    const nameInput = document.getElementById('nameInput');
    const searchBtn = document.getElementById('searchBtn');
    const resultArea = document.getElementById('resultArea');

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function showError(message, isWarning = true) {
        resultArea.innerHTML = `
            <div class="result error">
                <div class="label">⚠️ ${isWarning ? '无法查询' : '提示'}</div>
                <p>${escapeHtml(message)}</p >
            </div>
        `;
    }

    function showSuccess(impressionText, inputName) {
        resultArea.innerHTML = `
            <div class="result">
                <div class="label">✨ 给「${escapeHtml(inputName)}」的印象 ✨</div>
                <p>${escapeHtml(impressionText)}</p >
            </div>
        `;
    }

    function handleQuery() {
        const rawName = nameInput.value;
        if (!rawName || rawName.trim() === "") {
            showError("请先输入你的名字～");
            return;
        }
        const trimmedName = rawName.trim();

        // 1. 全局限流检查（每日总次数）
        if (!checkGlobalLimit()) {
            const waitSec = getGlobalWaitSeconds();
            const waitText = formatWaitTime(waitSec);
            showError(`今日查询次数已达上限（每日最多 ${RATE_LIMIT.globalMaxQueries} 次）。请等待 ${waitText} 后再试。`);
            return;
        }

        // 2. 名字冷却检查（每个名字每日一次）
        const cooldown = checkNameCooldown(trimmedName);
        if (!cooldown.ok) {
            const waitText = formatWaitTime(cooldown.waitSeconds);
            showError(`名字“${escapeHtml(trimmedName)}”今天已经查过啦，请等待 ${waitText} 后再查询。`);
            return;
        }

        // 3. 查询印象
        const impression = nameToImpression.get(trimmedName);
        if (impression) {
            recordQuery(trimmedName);
            showSuccess(impression, trimmedName);
        } else {
            // 未找到印象：不消耗全局次数，也不记录名字冷却（避免朋友输错被误封）
            resultArea.innerHTML = `
                <div class="result error">
                    <div class="label">🔍 没找到记录</div>
                    <p>“${escapeHtml(trimmedName)}” 不在印象库里。<br>试试检查大小写或输入你常用的别名～</p >
                </div>
            `;
        }
    }

    searchBtn.addEventListener('click', handleQuery);
    nameInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            handleQuery();
        }
    });

    console.log(`✅ 印象库已加载，共 ${nameToImpression.size} 个有效别名，每日限制：每名1次，每设备${RATE_LIMIT.globalMaxQueries}次`);
</script>
